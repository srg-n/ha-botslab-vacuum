# ==============================================================================
# Home Assistant Lovelace Cards - Botslab Vacuum
# ==============================================================================
#
# HOW TO USE
#   Settings -> Dashboards -> edit -> paste a block -> Save.
#   No entity_id editing is required: every block resolves the robot serial
#   with Jinja at render time.
#
# WHY THERE ARE NO HARDCODED ENTITY IDS
#   Entities are keyed by the robot's SERIAL NUMBER (unique_id is
#   "<serial>_<key>"), which Botslab assigns. It cannot be known in advance,
#   so each block does:
#
#       {% set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
#                                  | map(attribute='entity_id') | list %}
#       {% set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' %}
#
#   Entity ids then read sensor.<sn>_filter_life, select.<sn>_water_level,
#   camera.<sn>_map_camera, and so on.
#
#   Several robots? Set {% set sn = 'OTHER_SERIAL' %} at the top of a block.
#
# ------------------------------------------------------------------------------
# BUILT-IN CARDS
#   This integration comes bundled with its own frontend cards:
#   - custom:botslab-vacuum-map-card (Full interactive map, room cleaning, zone cleaning, spot cleaning)
#   - custom:botslab-routines-card (Scheduled cleaning routines management)
# ------------------------------------------------------------------------------


# ==============================================================================
# CARD 1 - Botslab Vacuum Map Card (RECOMMENDED)
# ==============================================================================
# Built-in modern interactive map card:
# - Zero external dependencies (no Xiaomi map card required).
# - Sequential or auto-ordered room cleaning (1 -> 2 or auto).
# - Per-room customized suction, water level, and repeat passes.
# - Free zone cleaning and spot cleaning (Go To Point).
# - Live robot and charger positions, path tracking, room outlines.
# - Full Visual Card Editor support in Home Assistant UI.
# ==============================================================================
type: custom:botslab-vacuum-map-card
entity: >
  {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                              | map(attribute='entity_id') | list -%}
  {{ ids | first if ids else 'vacuum.botslab_vacuum' }}
map_entity: >
  {%- set cams = states('camera') | selectattr('entity_id', 'match', '_map_camera$')
                               | map(attribute='entity_id') | list -%}
  {{ cams | first if cams else 'camera.botslab_map_camera' }}
title: Botslab Vacuum
default_mode: room
# auto_order: false   # false (default): Robot cleans rooms in exact selection order. true: Robot determines path.

---
# ==============================================================================
# CARD 2 - Standard Vacuum Control Card
# ==============================================================================
type: vacuum-card
entity: >
  {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                              | map(attribute='entity_id') | list -%}
  {{ ids | first if ids else 'vacuum.botslab_vacuum' }}
show_toolbar: true
compact_view: false

---
# ==============================================================================
# CARD 3 - Fallback Simple Map View (Standard Picture Glance)
# ==============================================================================
type: picture-glance
title: Cleaning Map
image: >
  {%- set ids = states('camera') | selectattr('entity_id', 'match', '_map_camera$')
                             | map(attribute='entity_id') | list -%}
  {{ ids | first if ids else 'camera.botslab_map_camera' }}
entities:
  - entity: >
      {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                  | map(attribute='entity_id') | list -%}
      {{ ids | first if ids else 'vacuum.botslab_vacuum' }}
    type: vacuum-entity

---
# ==============================================================================
# CARD 4 - Consumables, Settings and Actions
# ==============================================================================
# Keys are stable across versions:
#   sensors  : filter_life, main_brush_life, side_brush_life, sensor_dirtiness
#   switches : auto_boost, button_backlight, collision_protection
#   selects  : water_level, mop_mode
#   number   : volume_level
#   buttons  : locate, refresh_rooms, sync_map, reset_*
# ==============================================================================
type: entities
title: Maintenance and Settings
show_header_toggle: false
entities:
  - type: section
    name: Consumables
    entities:
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'sensor.' ~ sn ~ '_filter_life' }}
        name: HEPA Filter
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'sensor.' ~ sn ~ '_main_brush_life' }}
        name: Main Brush
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'sensor.' ~ sn ~ '_side_brush_life' }}
        name: Side Brush
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'sensor.' ~ sn ~ '_sensor_dirtiness' }}
        name: Sensors Cleanliness

  - type: section
    name: Settings
    entities:
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'select.' ~ sn ~ '_water_level' }}
        name: Water Flow Level
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'select.' ~ sn ~ '_mop_mode' }}
        name: Cleaning Mode
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'number.' ~ sn ~ '_volume_level' }}
        name: Voice Volume
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'switch.' ~ sn ~ '_auto_boost' }}
        name: Carpet Auto Boost
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'switch.' ~ sn ~ '_button_backlight' }}
        name: Button Backlight
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'switch.' ~ sn ~ '_collision_protection' }}
        name: Collision Protection

  - type: section
    name: Actions
    entities:
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'button.' ~ sn ~ '_locate' }}
        name: Locate Robot
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'button.' ~ sn ~ '_sync_map' }}
        name: Sync Map
      - entity: >
          {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                                      | map(attribute='entity_id') | list -%}
          {%- set sn = (ids | first | replace('vacuum.', '')) if ids else 'SERIAL' -%}
          {{ 'button.' ~ sn ~ '_refresh_rooms' }}
        name: Refresh Rooms

---
# ==============================================================================
# CARD 5 - Scheduled Cleaning Routines (bundled card)
# ==============================================================================
type: custom:botslab-routines-card
entity: >
  {%- set ids = states('vacuum') | selectattr('entity_id', 'match', '_vacuum$')
                              | map(attribute='entity_id') | list -%}
  {{ ids | first if ids else 'vacuum.botslab_vacuum' }}
